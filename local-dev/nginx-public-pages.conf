# Inside the Cyber server block. Replace its existing location /; retain the
# existing API, MCP negotiation, reader, assets and previous-release locations.
# Do not enable until the backend mounts the matching built frontend directory.
location = /index.html { return 301 /; }

location = / {
    proxy_pass http://127.0.0.1:8018;
    proxy_set_header Host $host;
}

# Place before other regex locations. These documents must never use index.html.
location ~ ^/(?:robots\.txt|llms\.txt|sitemap\.xml|sitemaps/[^/]+\.xml|index\.md|catalog(?:\.md)?|paper/[^/]+|papers/[^/]+|abs/[^/]+)$ {
    proxy_pass http://127.0.0.1:8018;
    proxy_set_header Host $host;
    # Backend responses vary by Accept; do not add a proxy cache that ignores it.
    proxy_cache off;
}

location / {
    try_files $uri @cyber_public_page;
}

location @cyber_public_page {
    proxy_pass http://127.0.0.1:8018;
    proxy_set_header Host $host;
    proxy_cache off;
}
