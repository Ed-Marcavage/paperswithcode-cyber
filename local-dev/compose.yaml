name: pwc-discovery
services:
  db:
    image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
    restart: unless-stopped
    environment:
      POSTGRES_DB: pwc_local
      POSTGRES_USER: pwc_local
      POSTGRES_PASSWORD: ${PWC_DB_PASSWORD:?Set PWC_DB_PASSWORD in .local.env}
    volumes:
      - catalog:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pwc_local -d pwc_local"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: ..
      dockerfile: local-dev/Dockerfile
      target: backend
    restart: unless-stopped
    env_file: ../.local.env
    environment:
      PWC_DB_HOST: db
      PWC_DB_PORT: "5432"
      PWC_HOST: "0.0.0.0"
      PWC_PORT: "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
  mcp:
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/health',timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
    build:
      context: .
      dockerfile: Mcp.Dockerfile
      additional_contexts:
        pwc_cli: https://github.com/Ed-Marcavage/pwc-cli-cyber.git#125ffe07aad3d268bc2e3ddd8d79f159b4bc2f2b
    environment:
      PWC_POSTHOG_PROJECT_TOKEN: ${VITE_POSTHOG_PROJECT_TOKEN:-}
      PWC_POSTHOG_HOST: ${VITE_POSTHOG_HOST:-https://us.i.posthog.com}
      CATALOG_ANALYTICS_ENV: ${CATALOG_ANALYTICS_ENV:-preview}
      PWC_API_URL: http://backend:8000/api/v1
      PWC_CATALOG_ONLY: "1"
      PWC_SITE_URL: http://localhost:${CATALOG_PORT:-8095}
      PWC_MCP_ALLOWED_HOSTS: localhost:*,127.0.0.1:*
      PWC_MCP_ALLOWED_ORIGINS: http://localhost:${CATALOG_PORT:-8095},http://127.0.0.1:${CATALOG_PORT:-8095}
      PWC_MCP_CURSOR_KEY_CURRENT: ${PWC_MCP_CURSOR_KEY_CURRENT:?Run configure.py}
    depends_on:
      backend:
        condition: service_healthy
  frontend:
    build:
      context: ..
      dockerfile: local-dev/Dockerfile
      target: frontend
    restart: unless-stopped
    environment:
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-localhost}
      VITE_DISABLE_AUTH: "1"
      VITE_CHAT_ENABLED: "false"
      VITE_LOCAL_CATALOG: "true"
      VITE_API_URL: ""
      VITE_POSTHOG_PROJECT_TOKEN: ${VITE_POSTHOG_PROJECT_TOKEN:-}
      VITE_POSTHOG_HOST: ${VITE_POSTHOG_HOST:-https://us.i.posthog.com}
      VITE_CATALOG_ANALYTICS_ENV: ${CATALOG_ANALYTICS_ENV:-preview}
    ports:
      - "127.0.0.1:${CATALOG_PORT:-8095}:8085"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8085/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20
  catalog-refresh:
    profiles: [catalog-refresh]
    image: ${COMPOSE_PROJECT_NAME:-pwc-discovery}-backend
    restart: unless-stopped
    env_file: ../.local.env
    environment:
      PWC_DB_HOST: db
      PWC_DB_PORT: "5432"
    volumes:
      - ./:/app/local-dev:ro
    command: [python, /app/local-dev/repository_catalog.py, --refresh, --execute, --loop]
    depends_on:
      db:
        condition: service_healthy
volumes:
  catalog:
